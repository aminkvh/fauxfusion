name: Build ffusion binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: ffusion-windows-x86_64.exe
            build_name: ffusion.exe
          - os: ubuntu-latest
            asset_name: ffusion-linux-x86_64
            build_name: ffusion
          - os: macos-latest
            asset_name: ffusion-macos-arm64
            build_name: ffusion
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cp target/release/${{ matrix.build_name }} ${{ matrix.asset_name }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: gh release create "${{ github.ref_name }}" artifacts/*/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
